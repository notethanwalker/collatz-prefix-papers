name: Check formalized components (partial coverage)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and compiled library cache
        run: |
          lake update
          lake exe cache get Mathlib.Analysis.SpecialFunctions.BinaryEntropy Mathlib.Tactic Mathlib.Data.Nat.ModEq
      - name: Build all formalized components
        run: lake build
      - name: Check every component's axiom dependencies
        run: |
          lake env lean VerificationAudit.lean > verification.log
          cat verification.log
          python3 check_audit.py verification.log
